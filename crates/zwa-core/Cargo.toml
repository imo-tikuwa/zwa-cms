[package]
name = "zwa-core"
version = "0.1.0"
description = "Cloudflare access and publishing shared by the ZWA CMS app and CLI"
license = "MIT"
edition = "2024"

[dependencies]
zwa-site = { path = "../zwa-site" }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
percent-encoding = "2.3.2"
base64 = "0.23.1"
sha2 = "0.11.1"
imagesize = "0.15.0"
log = "0.4"
