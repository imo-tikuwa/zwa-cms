[package]
name = "zwa-cms"
version = "0.1.0"
description = "Zero Web Admin CMS desktop app"
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "zwa_cms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["cjk-search"]
# Japanese/Chinese word segmentation for the site search index. Adds about
# 50 MB of dictionaries to the app; without it Japanese text is barely
# searchable.
cjk-search = ["zwa-site/cjk-search"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.11.1"
imagesize = "0.15.0"
percent-encoding = "2.3.2"
zwa-site = { version = "0.1.0", path = "../crates/zwa-site" }
axum = "0.8"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.54.1", features = ["net", "sync", "rt"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-dialog = "=2.8.2"
futures-util = "0.3.34"
zwa-core = { version = "0.1.0", path = "../crates/zwa-core" }
tauri-plugin-notification = "2.7.0"
tauri-plugin-log = "2"
log = "0.4"
aes-gcm = "0.10"
base64 = "0.23"
crypto_box = { version = "0.9.1", features = ["seal"] }

[target.'cfg(windows)'.dependencies]
# Windows Hello, for the app lock (src/lock/hello.rs).
windows = { version = "0.62", features = ["Security_Credentials", "Security_Cryptography", "Storage_Streams", "Foundation", "Win32_System_WinRT"] }
# MessageBeep for confirmations; bringing the Windows Hello dialog forward.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }
