[package]
name = "zwa-cli"
version = "0.1.0"
description = "Command line build and publish for Zero Web Admin CMS (e.g. on GitHub Actions)"
license = "MIT"
edition = "2024"

[[bin]]
name = "zwa"
path = "src/main.rs"

[features]
default = ["cjk-search"]
# Same search index as the desktop app (Japanese/Chinese segmentation).
cjk-search = ["zwa-site/cjk-search"]

[dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
zwa-core = { path = "../zwa-core" }
zwa-site = { path = "../zwa-site" }
